name: Tests

# Quality gate for every push and PR. The Docker image publish
# (docker-publish.yml) runs independently; this is what tells you a
# change is actually safe to ship.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported range's endpoints (3.14 blocked on lxml wheels).
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      # Installs from poetry.lock, as the dev machine and the image do (docker/Dockerfile
      # pins the same Poetry). fresh-resolve.yml tries the newest releases instead.
      - name: Install Poetry
        run: pipx install "poetry==2.5.1"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install project with all extras + dev tools from poetry.lock
        run: |
          poetry env use python
          poetry install --all-extras --with dev

      - name: Run tests
        run: poetry run pytest tests/ -v

  # ruff (check + format) and mypy are hard gates — mypy runs --strict via
  # pyproject's [tool.mypy]. The tree is clean and stays that way: keep new
  # code lint- and type-clean.
  lint:
    name: ruff + mypy (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: pipx install "poetry==2.5.1"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: poetry

      - name: Install project with all extras + dev tools from poetry.lock
        run: |
          poetry env use python
          poetry install --all-extras --with dev

      - name: Ruff check
        run: poetry run ruff check src/

      - name: Ruff format check
        run: poetry run ruff format --check src/

      - name: Mypy
        run: poetry run mypy src/
